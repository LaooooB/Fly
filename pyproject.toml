[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "malecns-cyberpet"
version = "0.1.0"
description = "Local 2D cyber-pet driven by the MaleCNS v1.0 fruit-fly connectome"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pygame-ce>=2.5,<3",
  "flybrain[build]==0.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
