name: tests

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install pytest numpy pygame-ce
      - name: Compile
        run: python -m compileall -q src
      - name: Test
        env:
          PYTHONPATH: src
        run: pytest -q
